name: Locked Windows CPU validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install hash-locked installer
        run: >-
          python -m pip --isolated install --index-url https://pypi.org/simple --no-deps --require-hashes --only-binary=:all: -r requirements/installer.txt
      - name: Check locks and install a new isolated environment
        run: python scripts/locked.py install
      - name: Verify installed package and bounded CPU tests
        run: python scripts/locked.py test
