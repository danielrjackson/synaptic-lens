name: Locked Windows CPU validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install hash-locked installer
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements/installer.txt
      - name: Check locks and install a new isolated environment
        run: python scripts/locked.py install
      - name: Verify installed package and bounded CPU tests
        run: python scripts/locked.py test
